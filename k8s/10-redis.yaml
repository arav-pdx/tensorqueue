# Single-instance Redis for the reference deployment. For production HA,
# replace with a managed Redis (ElastiCache/MemoryStore) or a
# Sentinel/Redis-Cluster setup — the app talks to REDIS_HOST/PORT only, so
# swapping the backend doesn't touch application code.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: tensorqueue
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--appendonly", "yes", "--requirepass", "$(REDIS_PASSWORD)"]
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: tensorqueue-secrets, key: REDIS_PASSWORD } }
          ports:
            - containerPort: 6379
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec: { command: ["redis-cli", "-a", "$(REDIS_PASSWORD)", "ping"] }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: tensorqueue
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests: { storage: 5Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: tensorqueue
spec:
  selector: { app: redis }
  ports:
    - port: 6379
      targetPort: 6379
