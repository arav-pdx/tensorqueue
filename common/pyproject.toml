[project]
name = "tensorqueue-common"
version = "0.1.0"
description = "Shared config, models, queue, and metrics for TensorQueue API and worker services"
requires-python = ">=3.11"
dependencies = [
    "redis>=5.0",
    "pydantic>=2.5",
    "prometheus-client>=0.19",
]

[tool.setuptools]
packages = ["tensorqueue_common"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
